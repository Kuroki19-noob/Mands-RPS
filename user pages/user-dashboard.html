<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User-Dashboard</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/general.css">
  <link rel="stylesheet" href="design.css">
  <link rel="stylesheet" href="/user pages/user-design.css">
</head>
<body>


<div class="dashboard-container">
    <aside class="sidebar">
  <!-- Brand Logo -->
  <div class="logo">
    <img src="/Assets/icons/logo-icon.gif" alt="Logo" class="logo-img">
    <h3 class="logo-text">Staylokal</h3>
  </div>

  <!-- Main Navigation -->
  <nav class="nav-bar">
    <ul class="nav-list">
      <li class="nav-item active">
        <a href="user-dashboard.html">
          <i data-lucide="home" class="icon"></i>
          <span>Dashboard</span>
        </a>
      </li>
      <li class="nav-item">
        <a href="user-apartment.html">
          <i data-lucide="building" class="icon"></i>
          <span>Apartment</span>
        </a>
      </li>
      <li class="nav-item">
        <a href="user-saved-apartment.html">
          <i data-lucide="bookmark" class="icon"></i>
          <span>Saved Apartments</span>
        </a>
      </li>
      <li class="nav-item">
        <a href="user-booking.html">
          <i data-lucide="calendar" class="icon"></i>
          <span>Bookings</span>
        </a>
      </li>
      <li class="nav-item">
        <a href="user-inquiries.html">
          <i data-lucide="message-square" class="icon"></i>
          <span>Inquiries</span>
        </a>
      </li>
      <li class="nav-item">
        <a href="user-reports.html">
          <i data-lucide="flag" class="icon"></i>
          <span>Reports</span>
        </a>
      </li>
    </ul>
  </nav>

  <!-- User Account / Footer Section -->
  <div class="account-section">
    <div class="user-profile">
      <img src="/images/avatar.jpg" alt="User Avatar" class="avatar">
      <div class="user-info">
        <span class="user-name">Navales Pisbok</span>
        <span class="user-role">Tenant</span>
      </div>
    </div>
    <a href="log-in.html" class="user-con-btn" title="Logout">
      <i data-lucide="log-out" class="icon"></i>
    <a href="settings.html" class="user-con-btn"></a>
      <i data-lucide="settings" class="icon" ></i>
    </a>
  </div>
</aside>
</div>


    
<main class="dashboard-main">
  <section class="dashboard-status-wrap">

    <header class="dashboard-header">
      <h2>Welcome, Navales Pisbok!</h2>
      <p>Here's a quick overview of your account.</p>
    </header>

    <div class="status-wrap">

      <div class="status-card">
        <i data-lucide="building" class="status-icon"></i>
        <h3>Total Apartments</h3>
        <p>5</p>
      </div>

      <div class="status-card">
        <i data-lucide="bookmark" class="status-icon"></i>
        <h3>Saved Apartments</h3>
        <p>2</p>
      </div>

      <div class="status-card">
        <i data-lucide="calendar" class="status-icon"></i>
        <h3>Bookings</h3>
        <p>3</p>
      </div>

      <div class="status-card">
        <i data-lucide="message-square" class="status-icon"></i>
        <h3>Inquiries</h3>
        <p>1</p>
      </div>

    </div>
  </section>
</main>

    
    <script>
        lucide.createIcons();
    </script>
    <script src="design.js"></script>
</body>
</html>
