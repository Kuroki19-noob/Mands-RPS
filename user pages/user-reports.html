<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User-Reports</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/general.css" />
    <link rel="stylesheet" href="design.css" />
    <link rel="stylesheet" href="/user pages/user-design.css" />
    <link rel="stylesheet" href="report-forms.css">
  </head>
  <body>
    <aside class="sidebar">
      <!-- Brand Logo -->
      <div class="logo">
    <img src="/Assets/icons/logo-icon.gif" alt="Logo" class="logo-img">
    <h3 class="logo-text">Staylokal</h3>
  </div>

      <!-- Main Navigation -->

      <nav class="nav-bar">
        <ul class="nav-list">
          <li class="nav-item">
            <a href="user-dashboard.html">
              <i data-lucide="home" class="icon"></i>
              <span>Dashboard</span>
            </a>
          </li>

          <li class="nav-item">
            <a href="user-apartment.html">
              <i data-lucide="building" class="icon"></i>
              <span>Apartment</span>
            </a>
          </li>

          <li class="nav-item">
            <a href="user-saved-apartment.html">
              <i data-lucide="bookmark" class="icon"></i>
              <span>Saved Apartments</span>
            </a>
          </li>

          <li class="nav-item">
            <a href="user-booking.html">
              <i data-lucide="calendar" class="icon"></i>
              <span>Bookings</span>
            </a>
          </li>

          <li class="nav-item">
            <a href="user-inquiries.html">
              <i data-lucide="message-square" class="icon"></i>
              <span>Inquiries</span>
            </a>
          </li>

          <li class="nav-item active">
            <a href="user-reports.html">
              <i data-lucide="flag" class="icon"></i>
              <span>Reports</span>
            </a>
          </li>
        </ul>
      </nav>
      <!-- User Account / Footer Section -->
      <div class="account-section">
        <div class="user-profile">
          <img src="/images/avatar.jpg" alt="User Avatar" class="avatar" />
          <div class="user-info">
            <span class="user-name">Navales Pisbok</span>
            <span class="user-role">Tenant</span>
          </div>
        </div>
          <a href="log-in.html" class="user-con-btn" title="Logout">
      <i data-lucide="log-out" class="icon"></i></a>
    <a href="settings.html" class="user-con-btn">
      <i data-lucide="settings" class="icon" ></i>
      </a>
        </a>
      </div>
    </aside>
    <main>
      <section class="report-container">
        <div class="report-form-container">
          <h1>apartment maintenance & issue report</h1>
          <p>Submit a report for maintenance concerns and issues.</p>
          <form class="report-forms" style="padding-bottom: 1rem;">
            <div class="report-input">
              <label for="fullName">fullname:</label>
              <input type="text" id="fullname" name="fullname" required />
            </div>
            <div class="report-input">
              <label for="unitNumber">Unit Num:</label>
              <input type="text" id="unitnumber" name="unitnumber" required />
            </div>
            <div class="report-input">
              <label for="phoneNumber">Phone Num:</label>
              <input type="text" id="phonenumber" name="phonenumber" required />
            </div>
            <div class="report-input">
              <label for="emailAddress">Email:</label>
              <input
                type="text"
                id="emailaddress"
                name="emailaddress"
                required
              />
            </div>
            <button type="submit" class="submit-btn">Submit Report</button>
          </form>
        </div>

        <div class="report-wrapper">
          <div class="report-img-attm">
            <i data-lucide="image" class="icon-big"></i>
            <h3 style="color: grey">Attachment here</h3>
          </div>
        </div>
      </section>
    </main>
    <script>
      lucide.createIcons();
    </script>
    <script src="design.js"></script>
  </body>
</html>
